<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Membership — 360 MOVE Uluwatu</title>
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="icon" href="assets/favicon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>

<a href="index.html" class="back-home">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  Back to site
</a>

<main class="mcard">
  <div class="eyebrow" style="justify-content:center;margin-bottom:16px;">My Membership</div>
  <div class="mcard-visual">
    <div class="mcard-head">
      <img src="assets/logo.png" alt="360 MOVE logo">
      <span>360 MOVE</span>
    </div>
    <div class="mcard-body">
      <span class="tag" id="statusTag"></span>

      <div class="mcard-row gold">
        <label>Member Name</label>
        <div id="mName">—</div>
      </div>
      <div class="mcard-row">
        <label>Member ID</label>
        <div id="mId" style="font-family:var(--font-mono);"></div>
      </div>
      <div class="mcard-row">
        <label>Membership Package</label>
        <div id="mPackage">—</div>
      </div>
      <div class="mcard-row">
        <label>Expiry Date</label>
        <div id="mExpiry">—</div>
      </div>

      <div class="mcard-actions">
        <button class="btn btn-line btn-block" id="logoutBtn">Log Out</button>
      </div>
    </div>
  </div>
</main>

<script src="js/store.js?v=4"></script>
<script>
  const memberId = Auth.currentMemberId();
  if(!memberId){ location.href = 'login.html'; }

  const member = DB.getMember(memberId);
  if(!member){ Auth.logoutMember(); location.href = 'login.html'; }

  DB.refreshStatus(member);

  document.getElementById('mName').textContent = member.name;
  document.getElementById('mId').textContent = member.memberId;
  document.getElementById('mPackage').textContent = member.membershipPackage;
  document.getElementById('mExpiry').textContent = formatDate(member.expiryDate);

  const tag = document.getElementById('statusTag');
  tag.textContent = member.status.toUpperCase();
  tag.className = 'tag ' + (member.status === 'Active' ? 'tag-active' : 'tag-expired');

  document.getElementById('logoutBtn').addEventListener('click', ()=>{
    Auth.logoutMember();
    location.href = 'index.html';
  });
</script>
</body>
</html>
