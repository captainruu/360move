<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account – Dash Gym Bali</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/member.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<div id="member-page">
  <nav style="position:fixed;top:0;left:0;right:0;z-index:100;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;background:rgba(10,10,10,0.95);border-bottom:1px solid var(--border);">
    <span style="font-family:var(--font-head);font-size:20px;letter-spacing:2px;">DASH GYM BALI</span>
    <div style="display:flex;gap:1rem;align-items:center;">
      <span id="memberNavName" style="font-family:var(--font-cond);font-size:13px;letter-spacing:1px;color:var(--gray);text-transform:uppercase;"></span>
      <button class="btn btn-outline btn-sm" onclick="doLogout()" data-en="Log Out" data-id="Keluar">Log Out</button>
    </div>
  </nav>
  <div class="dash-header">
    <div class="container">
      <p class="section-tag" data-en="Member Dashboard" data-id="Dashboard Member">Member Dashboard</p>
      <h2 class="dash-title" data-en="My Account" data-id="Akun Saya">My Account</h2>
    </div>
  </div>
  <div class="container" style="padding-top:2rem;padding-bottom:4rem;">
    <div class="member-idcard">
      <div class="micard-header">
        <img class="micard-logo" id="micardLogo" src="" alt="DASH GYM BALI">
      </div>
      <div class="micard-body">
        <div class="micard-status-pill" id="mStatusPill"><span id="mStatusText"></span></div>
        <div class="micard-label" data-en="Member ID" data-id="ID Member">Member ID</div>
        <div class="micard-id" id="mId"></div>
        <div class="micard-name" id="mName"></div>
        <div class="micard-phone" id="mPhone"></div>
        <div class="micard-expiry-label" data-en="Expiry Date" data-id="Tanggal Berakhir">Expiry Date</div>
        <div class="micard-expiry" id="mExpiry"></div>
        <button class="micard-checkin-btn" id="mCheckInBtn" onclick="selfCheckIn()" data-en="Check In" data-id="Check In">Check In</button>
      </div>
    </div>
    <div class="member-card">
      <div class="member-meta">
        <div class="meta-item"><div class="meta-label" data-en="Package" data-id="Paket">Package</div><div class="meta-val" id="mPkg"></div></div>
        <div class="meta-item"><div class="meta-label" data-en="Start Date" data-id="Tanggal Mulai">Start Date</div><div class="meta-val" id="mStart"></div></div>
        <div class="meta-item"><div class="meta-label" data-en="Days Remaining" data-id="Sisa Hari">Days Remaining</div><div class="meta-val" id="mDays"></div></div>
      </div>
      <div class="barcode-section">
        <h3 data-en="Your Member QR Code" data-id="QR Code Member Anda">Your Member QR Code</h3>
        <div id="qr-container"></div>
        <p style="font-family:var(--font-cond);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gray);margin-top:1rem;" id="mCodeDisplay"></p>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
  import { setLang, initModalOverlayClose } from './js/utils.js';
  import { doLogout } from './js/auth.js';
  import { initMemberPage } from './js/member-dashboard.js';

  window.doLogout = doLogout;
  window.setLang = setLang;
  initModalOverlayClose();
  initMemberPage();
</script>
</body>
</html>
