<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Login – Dash Gym Bali</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/member.css">
</head>
<body>

<div id="login-page">
  <div class="login-box">
    <div class="login-logo">
      <img src="assets/images/logo-gold.png" alt="DASH" onerror="this.style.display='none'">
      <div style="font-family:var(--font-head);font-size:22px;letter-spacing:2px;margin-top:.5rem;">DASH GYM BALI</div>
    </div>
    <h2 class="login-title" data-en="Welcome Back" data-id="Selamat Datang">Welcome Back</h2>
    <p class="login-sub" data-en="Enter your unique member code to access your account." data-id="Masukkan kode unik member Anda untuk mengakses akun.">Enter your unique member code to access your account.</p>
    <div class="form-group">
      <label data-en="Member Code" data-id="Kode Member">Member Code</label>
      <input type="text" id="loginCode" placeholder="e.g. DASH-2025-XXXXX" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;padding:.85rem;" onclick="doLogin()" data-en="Login" data-id="Masuk">Login</button>
    <div style="margin-top:1.5rem;">
      <a href="index.html" class="btn btn-outline" style="width:100%;justify-content:center;" data-en="← Back to Website" data-id="← Kembali ke Website">← Back to Website</a>
    </div>
    <p style="margin-top:1.5rem;font-size:12px;letter-spacing:1px;">
      <a href="admin-login.html" style="color:var(--gray);text-decoration:underline;" data-en="Staff / Admin Login" data-id="Login Staff / Admin">Staff / Admin Login</a>
    </p>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
  import { setLang, initModalOverlayClose } from './js/utils.js';
  import { doLogin } from './js/auth.js';
  window.doLogin = doLogin;
  window.setLang = setLang;
  initModalOverlayClose();
</script>
</body>
</html>
