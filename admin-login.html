<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login – Dash Gym Bali</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/member.css">
</head>
<body>

<div id="login-page">
  <div class="login-box">
    <div class="login-logo">
      <img src="assets/images/logo-gold.png" alt="DASH" onerror="this.style.display='none'">
      <div style="font-family:var(--font-head);font-size:22px;letter-spacing:2px;margin-top:.5rem;">DASH GYM BALI</div>
    </div>
    <h2 class="login-title" data-en="Staff / Admin Login" data-id="Login Staff / Admin">Staff / Admin Login</h2>
    <p class="login-sub" data-en="Sign in with your admin email and password." data-id="Masuk dengan email dan kata sandi admin Anda.">Sign in with your admin email and password.</p>
    <div class="form-group" style="text-align:left;">
      <label data-en="Admin Email" data-id="Email Admin">Admin Email</label>
      <input type="email" id="adminEmail" placeholder="admin@dashgymbali.com" autocomplete="username">
    </div>
    <div class="form-group" style="text-align:left;">
      <label data-en="Password" data-id="Kata Sandi">Password</label>
      <input type="password" id="adminPassword" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doAdminLogin()">
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;padding:.85rem;" onclick="doAdminLogin()" data-en="Login as Admin" data-id="Masuk sebagai Admin">Login as Admin</button>
    <div style="margin-top:1.5rem;">
      <a href="login.html" class="btn btn-outline" style="width:100%;justify-content:center;" data-en="← Member Login" data-id="← Login Member">← Member Login</a>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
  import { setLang, initModalOverlayClose } from './js/utils.js';
  import { doAdminLogin } from './js/auth.js';
  window.doAdminLogin = doAdminLogin;
  window.setLang = setLang;
  initModalOverlayClose();
</script>
</body>
</html>
