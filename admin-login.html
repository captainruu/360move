<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — 360 MOVE Uluwatu</title>
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="icon" href="assets/favicon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="stylesheet" href="css/style.css?v=14">
</head>
<body>

<a href="index.html" class="back-home">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  Back to site
</a>

<main class="auth-shell">
  <div class="auth-card">
    <div class="auth-logo"><img src="assets/logo.png" alt="360 MOVE logo"></div>
    <h1>Admin Login</h1>
    <p class="sub">Sign in to manage members, check-ins &amp; promos.</p>

    <form id="adminForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="admin@360move.com" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <div class="field-error" id="loginError">Incorrect email or password.</div>
      <button type="submit" class="btn btn-gold btn-block">Log In</button>
    </form>

    <p class="auth-foot" id="authModeNote">Demo credentials: <strong style="color:var(--grey-200);">admin@360move.com</strong> / <strong style="color:var(--grey-200);">360move2026</strong></p>
  </div>
</main>

<!--
  Admin login uses Firebase Authentication when js/firebase-config.js has real
  project values (see that file for where to get them). Until then, it falls
  back to the local demo login automatically — see js/firebase-auth.js.
-->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js?v=14"></script>
<script src="js/firebase-init.js?v=14"></script>
<script src="js/store.js?v=14"></script>
<script src="js/firebase-auth.js?v=14"></script>
<script>
  if(FirebaseAdminAuth.isLive()){
    document.getElementById('authModeNote').textContent = 'Signing in with Firebase Authentication.';
  }

  document.getElementById('adminForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const err = document.getElementById('loginError');
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = 'Signing in…';

    const result = await FirebaseAdminAuth.login(email, password);

    if(result.ok){
      location.href = 'admin.html';
    }else{
      err.textContent = result.error || 'Incorrect email or password.';
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Log In';
    }
  });
</script>
</body>
</html>
